workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - revenuecat
        - firebase
      flutter: 3.47.5
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lucas-goldner.pushup-bro
    scripts:
      - name: Enable Dart data assets
        script: |
          flutter config --enable-dart-data-assets

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Run code generation
        script: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart pub global activate flutter_gen
          fluttergen
          dart run intl_utils:generate
          dart run build_runner build

      - name: Run tests
        script: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart pub global activate very_good_cli
          very_good test

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Check the RevenueCat key
        script: |
          if [[ "$REVENUECAT_APPLE_API_KEY" != appl_* ]]; then
            echo "REVENUECAT_APPLE_API_KEY is missing or isn't an Apple key (appl_...)."
            echo "Add it as a secret in the 'revenuecat' environment group in Codemagic."
            exit 1
          fi

      - name: Add the Firebase config
        script: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_PROD" ]; then
            echo "GOOGLE_SERVICE_INFO_PLIST_PROD is missing, so bros and the leaderboard would be offline."
            echo "Add the prod GoogleService-Info.plist as a secret file in the 'firebase' environment group in Codemagic."
            exit 1
          fi
          mkdir -p ios/config/prod
          echo "$GOOGLE_SERVICE_INFO_PLIST_PROD" | base64 --decode > ios/config/prod/GoogleService-Info.plist

      - name: Build iOS app
        script: |
          flutter build ipa --release \
            --flavor prod \
            -t lib/flavor/main_prod.dart \
            --dart-define=REVENUECAT_APPLE_API_KEY=$REVENUECAT_APPLE_API_KEY \
            --build-number=$(($BUILD_NUMBER + 2)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    integrations:
      app_store_connect: Lucas Goldner AppStore

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
      scripts:
        - name: Discord notification
          script: |
            curl -H "Content-Type: application/json" \
              -X POST \
              -d "{\"content\": \"**Pushup Bro iOS Build #$BUILD_NUMBER** finished with status: **$FCI_BUILD_STEP_STATUS**\nBranch: $FCI_BRANCH\nCommit: $FCI_COMMIT\"}" \
              "https://discord.com/api/webhooks/1397248031488741376/kIiNDbHFpZYx6wAcZDZW3ULoNuVfrweB4TS_xF55rYSqf6f-TgSg3tyb14l8hdj1jllS"
