name: pushup_bro
description: Track your pushups with ease using the sensors in your AirPods!
publish_to: "none"

version: 2.0.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  animated_flip_counter: ^0.3.4
  audioplayers: ^6.8.1
  camera: ^0.12.1
  carbon_icons:
    path: packages/carbon_icons_patched
  carousel_slider: ^5.1.2
  circular_clip_route: ^0.2.0+3
  cloud_firestore: ^7.1.0
  cupertino_icons: ^2.0.0
  duo_kit: ^0.1.2
  equatable: ^2.0.5
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_airpods:
    path: packages/flutter_airpods
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_scene: ^0.24.3
  flutter_timezone: ^5.1.1
  foldable: ^1.0.5
  hooks: ^2.2.0
  intl: ^0.20.2
  intl_utils: ^2.8.1
  liquid_swipe: ^3.0.0
  mmkv: ^2.4.2
  modal_bottom_sheet: ^3.0.0-pre
  path_provider: ^2.0.12
  purchases_flutter: ^10.17.0
  qr: ^4.0.0
  rive: ^0.14.11
  shared_preferences: ^2.0.17
  table_calendar: ^3.0.8
  timezone: ^0.11.2
  url_launcher: ^6.1.9
  vector_math: ^2.4.3

dev_dependencies:
  build_runner: ^2.3.3
  flutter_gen_runner: ^5.1.0+1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/fonts/
    - assets/images/
    - assets/images/app_icons/
    - assets/images/island/
    - assets/images/island/accessories/
    - assets/images/island/quests/
    - assets/images/island/quests/intro/
    - assets/images/trek/
    - assets/rive/
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Light.ttf
          weight: 300
    - family: Cabinet Grotesk
      fonts:
        - asset: assets/fonts/CabinetGrotesk-Extrabold.ttf
          weight: 800
        - asset: assets/fonts/CabinetGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/CabinetGrotesk-Medium.ttf
          weight: 500

flutter_intl:
  enabled: true
  main_locale: en
  arb_dir: assets/l10n
  ouput_dir: lib/generated

flutter_gen:
  output: lib/generated/
  line_length: 80
  assets:
    exclude:
      # Played by name through GameAudio ("super" is no valid getter).
      - assets/audio/sfx/**
      - assets/audio/music/**

  integrations:
    rive: true
