name: pushup_bro
description: Track your pushups with ease using the sensors in your AirPods!
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  animated_flip_counter: ^0.3.4
  audioplayers: ^6.8.1
  carbon_icons:
    path: packages/carbon_icons_patched
  carousel_slider: ^5.1.2
  circular_clip_route: ^0.2.0+3
  cupertino_icons: ^2.0.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_airpods: ^1.0.3
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  intl_utils: ^2.8.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  liquid_swipe: ^3.0.0
  modal_bottom_sheet: ^3.0.0-pre
  path_provider: ^2.0.12
  rive: ^0.14.11
  shared_preferences: ^2.0.17
  table_calendar: ^3.0.8
  url_launcher: ^6.1.9

dev_dependencies:
  build_runner: ^2.3.3
  flutter_gen_runner: ^5.1.0+1
  flutter_test:
    sdk: flutter
  isar_community_generator: ^3.3.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/fonts/
    - assets/rive/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Light.ttf
          weight: 300

flutter_intl:
  enabled: true
  main_locale: en
  arb_dir: assets/l10n
  ouput_dir: lib/generated

flutter_gen:
  output: lib/generated/
  line_length: 80

  integrations:
    rive: true
